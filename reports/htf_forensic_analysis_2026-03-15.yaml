# SECTION 4: GAPS AND FLAGS
# ═══════════════════════════════════════════════════════════════════════════════

gaps_and_flags:

  critical_gap_daily_detection:
    severity: CRITICAL
    description: |
      The detection engine does NOT currently run primitives on 1D bars.
      All Daily analysis in this report was done manually from raw bar data.
      For v2 phase detector to work, Daily detection must be enabled.
    action: "Extend CascadeEngine and detect.py to include 1D timeframe."
    impact: |
      Without Daily detection, v2 cannot compute:
      - daily_structure_direction
      - daily displacement events
      - daily MSS events
      - daily FVG lifecycle

  h1_alignment_method:
    severity: MEDIUM
    description: |
      v2 specifies h1_alignment uses MSS-first, swing structure secondary.
      Trade 2 analysis shows no 1H bullish MSS fires, yet h1 IS counter.
      Using swing HH/HL as primary would detect counter correctly.
    status: OPEN_ITEM (h1_counter_detection_method in v2 blockers)
    recommendation: |
      Allow swing structure (HH/HL pattern) to determine h1_alignment.
      MSS confirms the structure shift but shouldn't gate it.

  kill_zone_realignment:
    severity: MEDIUM
    description: |
      Trade 1 shows 15m bearish MSS at 03:30 as the execution signal.
      Strict v2 requires 1H MSS to flip before RETRACE→EXPANSION.
      Within kill zones, execution TF structure may be sufficient.
    recommendation: |
      Add kill zone exception to h1_alignment rules:
      "Within LOKZ/NYOKZ, 15m/5m MSS in daily direction counts as realignment
      if no opposing 1H MSS fires in last 2 hours."

  smt_gap:
    severity: LOW
    description: |
      Trade 2 used SMT (DXY divergence) as sweep substitute.
      SMT is not an L1 primitive.
    status: TOLERATED
    note: "Log as known miss. Reassess if multiple trades require SMT."

  fvg_state_tracking:
    severity: LOW
    description: |
      FVG 'state' field shows 'None' in 4H detections.
      FVG lifecycle (ACTIVE → CE_TOUCHED → BOUNDARY_CLOSED) may not be
      fully tracked on HTF timeframes.
    action: "Verify FVG state machine runs on all TFs including 4H/1H."


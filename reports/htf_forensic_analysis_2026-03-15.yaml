parameter_candidates:

  displacement:

    body_ratio:
      proposed: 0.65
      trade_1_requirement: "<= 0.658 (Sept 24 bar has 0.658)"
      trade_2_requirement: "N/A (no daily displacement expected during retrace)"
      trade_3_requirement: "N/A (no daily displacement — RANGE phase)"
      trade_4_requirement: "N/A (LTF only)"
      cross_trade_intersection: "<= 0.65"
      recommendation: |
        KEEP 0.65 for HTF displacement.
        Sept 24 fires at 0.658 — passes the 0.65 gate.
        Sept 23 fires at 0.840 — easily passes.
        Trade 3's lack of daily displacement is CORRECT behavior for RANGE.
      
    atr_multiple:
      proposed: 1.5
      trade_1_fires: "Sept 23 (1.65x), Sept 24 (1.97x) — both pass 1.5x"
      trade_3_analysis: |
        No daily bar between Nov-Dec passes 1.5x with 0.65+ body_ratio.
        Best candidates:
          - Dec 10: body=0.693, ATR=1.31 (ATR just below threshold)
          - Nov 24: body=0.630, ATR=1.47 (body just below threshold)
        Lowering ATR to 1.3x would make Dec 10 fire — but this may be too loose.
      recommendation: |
        KEEP 1.5x for HTF displacement.
        Trade 3 NOT having daily displacement is the correct RANGE signal.
        Lowering would create false positives.

    mode:
      proposed: AND
      recommendation: KEEP AND mode. Both gates must pass for quality displacement.

  mss:

    confirmation_window:
      proposed: 1 bar
      analysis: |
        With only 1 bar confirmation window on daily, MSS must fire on the
        displacement bar itself or immediately after. Given daily bar granularity,
        1 bar is appropriate — each bar is a full trading day.
      recommendation: KEEP 1 bar for Daily. Consider 2 bars for 4H.

    body_ratio:
      proposed: 0.65 (inherits from displacement)
      recommendation: KEEP 0.65. MSS requires displacement; displacement gate suffices.

  swing_points:

    N_daily:
      proposed: UNDEFINED
      analysis_from_data: |
        With N=2 swing detection on daily bars:
          - Sept 24: Swing Low at 1.16454 (correct — expansion low)
          - Sept 30: Swing High at 1.17785 (retrace high)
          - Oct 1: Swing Low at 1.16829 (continuation low)
        N=2 captures the major structural swings correctly.
      recommendation: N=2 for Daily (same as 15m locked value)
      
    N_4h:
      proposed: UNDEFINED
      analysis: |
        4H detections with current engine show swings being detected.
        The existing 4H swing detection appears to use N=2 or similar.
      recommendation: N=2 for 4H

    N_1h:
      current: "Uses LTF locked params (N=2 for 15m suggests N=2 for 1H)"
      recommendation: N=2 for 1H (confirm with Olya)

    height_filter_daily:
      analysis: |
        Daily bars have 50-100+ pip ranges. A 3 pip height filter (as used for 15m)
        would capture ALL swings on daily — too sensitive.
        Suggest: 10-20 pips minimum for daily swing significance.
      recommendation: 15 pips for Daily (roughly 25-30% of typical daily range)

    height_filter_4h:
      analysis: |
        4H bars typically 20-40 pips range. 
        Suggest: 5-10 pips minimum.
      recommendation: 8 pips for 4H

  fvg:

    floor_daily:
      analysis: |
        Daily FVGs detected in the data:
          - Sept 24: 24.9 pips
          - Sept 25: 20.8 pips
          - Dec 3: 26.0 pips
          - Dec 10: 25.1 pips
          - Dec 11: 61.9 pips
        All daily FVGs are 20+ pips. A 5-10 pip floor would capture all.
        A 15 pip floor would filter small gaps while keeping significant ones.
      recommendation: 10 pips for Daily (conservative — captures meaningful gaps)

    floor_4h:
      analysis: |
        4H FVGs detected range from 3.75 to 36.6 pips.
        Current engine appears to use a low floor and detects 4H FVGs.
      recommendation: 3 pips for 4H (matches current behavior)


autoresearch:

  concept: |
    Once v2 is validated against 10+ trades, the Karpathy AutoResearch
    pattern automates the calibration loop:
      Ground truth: Olya's annotated trades (date, state, direction, outcome)
      System under test: Phase detector + chain evaluator
      Fitness function: Does the system correctly classify each trade's state
                        AND fire the chain at the correct bar in the correct direction?
      Iteration: Adjust phase detection thresholds (e.g., persistence bars,
                 momentum stall window, key level tolerance) → re-run → re-score

  tunable_parameters:
    - "h1_counter_persistence_bars (currently 3)"
    - "momentum_stall_window (currently 3 daily bars)"
    - "key_level_tolerance (currently ATR_daily * 0.5)"
    - "transition_lockout_bars (currently 2x 1H)"
    - "retrace_to_range_duration (currently 3 daily bars)"
    - "HTF swing N (currently UNDEFINED)"
    - "HTF displacement body_ratio (currently PROPOSED 0.65)"
    - "HTF MSS confirmation_window (currently PROPOSED 1)"

  fitness_metric: |
    Precision/recall against Olya's annotations.
    NOT trading performance (Sharpe, RR, etc.).
    System is correct when it sees what Olya sees.

  scope: |
    Applies to every tunable layer:
    - L1.5 HTF parameter calibration
    - Phase detector threshold tuning
    - Execution chain variant selection
    Unified research loop. Same pattern. Different parameters.

